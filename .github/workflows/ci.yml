name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[a2a,test]' 'a2a-sdk[http-server]>=1.3,<2'
      - run: python -m pytest -q
      - name: examples
        run: |
          python examples/fanout.py
          python examples/a2a_delegation.py
      - name: pydantic-ai recipe
        env:
          PYDANTIC_AI_NO_BANNER: '1'
        run: |
          python -m pip install pydantic-ai-slim
          python examples/pydantic_ai_delegation.py

  # The core has no dependencies and supports Python 3.9.
  core:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('a2a') is not None)"
      - run: python -m pytest -q
      - run: python examples/fanout.py

  # The golden fixtures must stay byte-identical to llm-budget's copy.
  fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Mattbusel/llm-budget
          path: llm-budget
      - run: diff -r tests/fixtures/budget_context llm-budget/tests/fixtures/budget_context
