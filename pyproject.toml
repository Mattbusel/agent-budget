[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llm-agent-budget"
version = "0.1.3"
description = "Hard USD budgets for agents that delegate: reserve/settle child scopes for parallel sub-agents, and the A2A budget extension over A2A metadata, W3C baggage and MCP _meta"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Matthew Charles Busel", email = "mattbusel@gmail.com" }]
keywords = ["llm", "agents", "budget", "cost", "a2a", "mcp", "multi-agent", "opentelemetry", "strands-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
a2a = ["a2a-sdk>=1.3,<2"]
strands = ["strands-agents>=1.43"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6.100"]

[project.urls]
Homepage = "https://github.com/Mattbusel/agent-budget"
Source = "https://github.com/Mattbusel/agent-budget"
Issues = "https://github.com/Mattbusel/agent-budget/issues"
Changelog = "https://github.com/Mattbusel/agent-budget/blob/main/CHANGELOG.md"
"Rust crate" = "https://crates.io/crates/llm-budget"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_budget"]

[tool.hatch.build.targets.sdist]
include = ["src/agent_budget", "tests", "docs", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/agent_budget"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--doctest-modules --import-mode=importlib"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
